name: build_install_verify

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build_install_verify:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4.2.2

    - name: Prep, Packages
      run: |
        sudo ./toolbox/pkgs/debian.sh

    - name: Prep, set PATH
      run: |
        echo "/opt/pipx_bin" >> $GITHUB_PATH
        echo "$(pipx environment | grep 'PIPX_BIN_DIR=' | cut -d '=' -f2)" >> $GITHUB_PATH
        cijoe --help || true
        cijoe --version || true

    - name: Prep, cijoe
      run: |
        cijoe --help
        cijoe --version

    - name: Configure
      run: |
        make configure
        meson configure build -Dxal-server=enabled

    - name: Build
      run: make build

    - name: Install
      run: sudo make install

    - name: Test
      run: make test-using-loop

    - name: CIJOE, upload report.html
      if: always()
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-report
        path: cijoe/cijoe-output/report.html

    - name: CIJOE, archive cijoe-output
      if: always()
      run: |
        tar czf cijoe-output.tar.gz cijoe/cijoe-output

    - name: CIJOE, upload cijoe-output
      if: always()
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-output
        path: cijoe-output.tar.gz

    - name: Test, mounted
      id: mounted
      run: make test-reflink-using-loop

    - name: CIJOE, upload report.html, mounted
      if: always() && steps.mounted.outcome != 'skipped'
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-report-mounted
        path: cijoe/cijoe-output/report.html

    - name: CIJOE, archive cijoe-output, mounted
      if: always() && steps.mounted.outcome != 'skipped'
      run: |
        tar czf cijoe-output-mounted.tar.gz cijoe/cijoe-output

    - name: CIJOE, upload cijoe-output, mounted
      if: always() && steps.mounted.outcome != 'skipped'
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-output-mounted
        path: cijoe-output-mounted.tar.gz

    - name: Test, read lease
      id: lease
      # The runner is thrown away after the job, so the tests may change fs.lease-break-time
      env:
        XAL_TEST_SET_LEASE_BREAK_TIME: 1
      run: make test-lease-using-loop

    - name: CIJOE, upload report.html, read lease
      if: always() && steps.lease.outcome != 'skipped'
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-report-lease
        path: cijoe/cijoe-output/report.html

    - name: CIJOE, archive cijoe-output, read lease
      if: always() && steps.lease.outcome != 'skipped'
      run: |
        tar czf cijoe-output-lease.tar.gz cijoe/cijoe-output

    - name: CIJOE, upload cijoe-output, read lease
      if: always() && steps.lease.outcome != 'skipped'
      uses: actions/upload-artifact@v4.3.0
      with:
        name: cijoe-output-lease
        path: cijoe-output-lease.tar.gz

    - name: Upload index and block map artifacts
      if: always()
      uses: actions/upload-artifact@v4.3.0
      with:
        name: artifacts
        path: /tmp/artifacts
