---
doc: |
  Prepare an XFS filesystem on a zram device and run the read-lease tests

  Same as prep_and_test_lease.yaml but backs the fixture with zram instead of a loop device,
  which avoids loop-minor contention on desktops where snapd occupies /dev/loop0../dev/loopN.

  * Creates /dev/zram0 (config.xal.dev_path)
  * Formats it with XFS and keeps it mounted, as XAL_WATCHMODE_READ_LEASE works on a mounted
    filesystem through the FIEMAP backend
  * Runs the read-lease tests (tests/test_lease.py), which drive the 'xal_lease_hold' helper to
    hold a file's extents while a writer opens or truncates it

steps:
- name: prep_bdev
  uses: prep_zram
  with:
    dev-path: '{{ config.xal.dev_path }}'
    size-in-gb: 4

- name: prep_fs
  uses: prep_xfs
  with:
    dev-path: '{{ config.xal.dev_path }}'
    mountpoint: '{{ config.xal.mountpoint }}'
    reflink: true

- name: prep_files
  uses: prep_files
  with:
    dev-path: '{{ config.xal.dev_path }}'
    mountpoint: '{{ config.xal.mountpoint }}'
    keep_mounted: true
    skip_populate: true

- name: test
  uses: core.testrunner
  with:
    run_local: true
    random_order: false
    args: "tests/test_lease.py"
